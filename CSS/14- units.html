<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css units</title>
    <style>
        .parent{
            width: 600px;
            height: 250px;
            background-color: rgb(134, 128, 130);
            border:2px solid black;
            border-radius: 10px;
        }
        .child{
            width: 50%;
            height: 50%;
            background-color: rgb(243, 13, 13);
            border-radius: 50%;
        }
        h1{
            /* font-size:4vw; */
            font-size:1em
            /* 1em = 30px */
            /* 1rem = 16px  */
        }
        h2{
            font-size:2em;
        }
        h3{
            font-size:1.5em
        }
        h4{
            font-size:3em;
        }
    </style>
    
      <h1>ndae! Praesentium facilis in perferendis sit repellat, quibusdam ut eveniet delectus, aperiam consequuntur consectetur quaerat enim modi illum vero!</h1>
      <h2>hello world!</h2>
      <h3>hello my name is john doe </h3>
      <h4>we are learning css units</h4>
</head>
<body>
    <div class="parent">
        <div class="child"></div>

    </div>
</body>
</html>
