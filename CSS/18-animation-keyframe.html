<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Animation keyframe</title>
    <style>
        .container{
            width: 200px;
            height: 200px;
            background-color: rgb(255, 253, 253);
            border: 2px solid black;
            border-radius: 100px;

    
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: blue;
            border-radius: 100px;
            animation-duration:5s;
            /* animation-timing-function: ease-in; */
            animation-delay:1s;
            animation-iteration-count:10;
            animation-direction:normal;
            /* transition: all 3s iteration(10); */
            animation-name: box1;
            position:relative;
        }
            @keyframes box1  {
                0%{left: 0px;top: 0px;}
                15%{
                    left: 50px;top: -25px;
                }
                25%{
                    left: 100px;top: 0px;

                }
                50%{
                    left: 100px;top: 100px;
                }
                75%{
                    left: 0px;top: 100px;
                }
                100%{
                    left: 0px;top: 0px;
                }
            }
