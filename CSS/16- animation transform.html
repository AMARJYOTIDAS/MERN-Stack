<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform animation</title>
    <style>
   div{
    height: 300px;
    width: 300px;
    background-color: rgb(85, 103, 103);
    border: 2px solid black;
    border-radius: 200px;
    margin: 50px;
    /* top: 80px; */
    /* left: 500px; */
    /* padding-bottom: 100px; */
     transition: all 0.2s ease-in;
     text-align:center;

}
div:hover{
    background-color: red;
    color: white;
    font-size: 20px;
    padding: auto;
    /* transform: rotateZ(45deg); */
    /* transform: rotate(45deg); */
    transform: rotateY(45deg);
    transform: scale(2);
     /* transform: scaleZ(2);*/
    /* transform: skew(1440deg); */
    /* transform: rotate3d(360deg); */

}
    </style>
</head>
<body>
    <div> i am a student</div>
</body>
</html>
